<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ahas – Snake Game</title>
<style>
:root{--bg:#fbf7ee;--ink:#2a1647;--mango:#ffc83d;--pandan:#2e9e6b;--kamatis:#e8452c;--surface:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#1b1030;--ink:#f6efe0;--surface:#2a1647}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;display:flex;justify-content:center;padding:18px 14px;touch-action:manipulation}
main{width:100%;max-width:440px}
h1{font-size:2.2rem;margin:0 0 2px;letter-spacing:-.5px}
p.sub{margin:0 0 14px;opacity:.75}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.stat{background:var(--surface);border:2px solid var(--ink);border-radius:10px;padding:6px 12px;font-weight:700;min-width:84px}
.stat small{display:block;font-weight:400;font-size:.7rem;opacity:.7}
.wrap{position:relative}
canvas{width:100%;aspect-ratio:1;display:block;border:3px solid var(--ink);border-radius:12px;background:#2a1647;touch-action:none}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(42,22,71,.82);border-radius:12px;color:#fff;text-align:center;padding:16px}
#ov h2{margin:0;font-size:1.6rem}
button{font:inherit;font-weight:700;border:2px solid var(--ink);border-radius:10px;padding:8px 16px;background:var(--mango);color:#2a1647;cursor:pointer}
button:focus-visible{outline:3px solid var(--kamatis);outline-offset:2px}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,52px);gap:6px;justify-content:center;margin-top:14px}
.pad button{padding:0;font-size:1.3rem;background:var(--surface);color:var(--ink)}
.pad .u{grid-column:2}
.hint{text-align:center;font-size:.85rem;opacity:.7;margin-top:10px}
</style>
</head>
<body>
<main>
  <h1>Ahas</h1>
  <p class="sub">Kainin ang mangga 🥭 at huwag bumangga sa pader o sa sarili mong katawan.</p>

  <div class="bar">
    <div class="stat"><small>Puntos</small><span id="score">0</span></div>
    <div class="stat"><small>Pinakamataas</small><span id="best">0</span></div>
    <button id="pause">Pause</button>
  </div>

  <div class="wrap">
    <canvas id="c" width="400" height="400" aria-label="Snake game board"></canvas>
    <div id="ov">
      <h2 id="ovt">Handa ka na ba?</h2>
      <div id="ovs">Gamitin ang arrow keys, WASD, o i-swipe.</div>
      <button id="go">Simulan</button>
    </div>
  </div>

  <div class="pad" aria-label="Kontrol">
    <button class="u" data-d="U" aria-label="Taas">▲</button>
    <button data-d="L" aria-label="Kaliwa" style="grid-row:2;grid-column:1">◀</button>
    <button data-d="D" aria-label="Baba" style="grid-row:2;grid-column:2">▼</button>
    <button data-d="R" aria-label="Kanan" style="grid-row:2;grid-column:3">▶</button>
  </div>
  <div class="hint">Space = pause/resume</div>
</main>

<script>
const N=20,S=20,cv=document.getElementById("c"),ctx=cv.getContext("2d");
const $=id=>document.getElementById(id);
const V={U:[0,-1],D:[0,1],L:[-1,0],R:[1,0]};
let snake,dir,nxt,food,score,delay,tid,steps=0,state="idle";

function getBest(){try{return +localStorage.getItem("ahas-best")||0}catch(e){return 0}}
function setBest(v){try{localStorage.setItem("ahas-best",v)}catch(e){}}
$("best").textContent=getBest();

function reset(){
  snake=[[10,10],[9,10],[8,10]];dir="R";nxt="R";score=0;delay=220;steps=0;
  $("score").textContent=0;placeFood();draw();
}
function placeFood(){
  do{food=[Math.floor(Math.random()*N),Math.floor(Math.random()*N)]}
  while(snake.some(s=>s[0]===food[0]&&s[1]===food[1]));
}
function turn(d){
  const o={U:"D",D:"U",L:"R",R:"L"};
  if(d!==o[dir])nxt=d;
  if(state==="idle")begin();
}
function begin(){
  if(state==="run")return;
  if(state==="idle"||state==="over")reset();
  state="run";$("ov").style.display="none";$("pause").textContent="Pause";
  clearTimeout(tid);tick();
}
function pause(){
  if(state==="run"){
    state="pause";clearTimeout(tid);
    $("ovt").textContent="Naka-pause";$("ovs").textContent="";$("go").textContent="Ituloy";$("ov").style.display="flex";
    $("pause").textContent="Ituloy";
  }else if(state==="pause"){begin()}
}
function tick(){
  if(state!=="run")return;
  dir=nxt;
  const h=[snake[0][0]+V[dir][0],snake[0][1]+V[dir][1]];
  const eat=h[0]===food[0]&&h[1]===food[1];
  const body=eat?snake:snake.slice(0,-1);
  if(h[0]<0||h[1]<0||h[0]>=N||h[1]>=N||body.some(s=>s[0]===h[0]&&s[1]===h[1]))return over();
  snake.unshift(h);
  if(eat){
    score++;$("score").textContent=score;
    delay=score<5?220:Math.max(70,220-(score-4)*8);placeFood();
  }else snake.pop();
  steps++;draw();
  tid=setTimeout(tick,delay);
}
function over(){
  state="over";
  let msg="Puntos: "+score;
  if(score>getBest()){setBest(score);$("best").textContent=score;msg+=" – Bagong rekord!"}
  $("ovt").textContent="Talo!";$("ovs").textContent=msg;$("go").textContent="Ulitin";
  $("ov").style.display="flex";$("pause").textContent="Pause";
}
function draw(){
  ctx.fillStyle="#2a1647";ctx.fillRect(0,0,400,400);
  ctx.fillStyle="#34205a";
  for(let x=0;x<N;x++)for(let y=0;y<N;y++)if((x+y)%2)ctx.fillRect(x*S,y*S,S,S);
  ctx.font="17px serif";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText("🥭",food[0]*S+S/2,food[1]*S+S/2+1);
  drawSnake();
}
function bodyPoints(){
  const c=snake.map(s=>[s[0]*S+S/2,s[1]*S+S/2]),n=c.length,P=[],K=6;
  const mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
  let prev=c[0];
  for(let i=0;i<n;i++){
    const end=i===n-1?c[n-1]:mid(c[i],c[i+1]);
    for(let k=0;k<K;k++){
      const t=k/K,u=1-t;
      P.push([u*u*prev[0]+2*u*t*c[i][0]+t*t*end[0],u*u*prev[1]+2*u*t*c[i][1]+t*t*end[1]]);
    }
    prev=end;
  }
  P.push(c[n-1]);
  return P;
}
function drawSnake(){
  const P=bodyPoints(),L=P.length-1;
  const rad=t=>t<.12?7+(t/.12)*1.5:t<.55?8.5:8.5-(t-.55)/.45*6.5;
  ctx.lineCap="round";
  // balangkas (madilim na gilid)
  for(let i=L;i>=0;i--){
    ctx.fillStyle="#14391f";
    ctx.beginPath();ctx.arc(P[i][0],P[i][1],rad(i/L)+1.3,0,7);ctx.fill();
  }
  // katawan na may gradient ng kulay
  for(let i=L;i>=0;i--){
    const t=i/L;
    ctx.fillStyle=`hsl(140,45%,${40-t*10}%)`;
    ctx.beginPath();ctx.arc(P[i][0],P[i][1],rad(t),0,7);ctx.fill();
  }
  // diamond / batik pattern sa likod
  for(let i=8;i<=L;i+=9){
    const t=i/L,r=rad(t);
    ctx.fillStyle="#1c4f2e";
    ctx.beginPath();ctx.arc(P[i][0],P[i][1],r*.62,0,7);ctx.fill();
    ctx.fillStyle="#d9b04a";
    ctx.beginPath();ctx.arc(P[i][0],P[i][1],r*.22,0,7);ctx.fill();
  }
  // kinang sa ibabaw ng katawan
  ctx.fillStyle="rgba(255,255,255,.13)";
  for(let i=L;i>=4;i--){
    const r=rad(i/L);
    ctx.beginPath();ctx.arc(P[i][0]-r*.25,P[i][1]-r*.3,r*.35,0,7);ctx.fill();
  }
  // ulo
  const h=P[0],v=V[dir],pp=[-v[1],v[0]],ang=Math.atan2(v[1],v[0]);
  if(steps%4!==0){ // dila na kumikislap
    const t1=[h[0]+v[0]*17,h[1]+v[1]*17];
    ctx.strokeStyle="#e8452c";ctx.lineWidth=1.7;ctx.lineCap="butt";
    ctx.beginPath();ctx.moveTo(h[0]+v[0]*10,h[1]+v[1]*10);ctx.lineTo(t1[0],t1[1]);
    ctx.lineTo(t1[0]+v[0]*3+pp[0]*3,t1[1]+v[1]*3+pp[1]*3);
    ctx.moveTo(t1[0],t1[1]);ctx.lineTo(t1[0]+v[0]*3-pp[0]*3,t1[1]+v[1]*3-pp[1]*3);
    ctx.stroke();
  }
  ctx.fillStyle="#14391f";
  ctx.beginPath();ctx.ellipse(h[0]+v[0]*2,h[1]+v[1]*2,12.3,9.3,ang,0,7);ctx.fill();
  ctx.fillStyle="hsl(140,45%,42%)";
  ctx.beginPath();ctx.ellipse(h[0]+v[0]*2,h[1]+v[1]*2,11,8,ang,0,7);ctx.fill();
  ctx.fillStyle="rgba(255,255,255,.15)";
  ctx.beginPath();ctx.ellipse(h[0]+v[0]*3-pp[0]*2,h[1]+v[1]*3-pp[1]*2,6,3,ang,0,7);ctx.fill();
  // butas ng ilong
  ctx.fillStyle="#0d2615";
  [1,-1].forEach(sd=>{ctx.beginPath();ctx.arc(h[0]+v[0]*10+pp[0]*2.5*sd,h[1]+v[1]*10+pp[1]*2.5*sd,.9,0,7);ctx.fill()});
  // mata (ginto na may hating pupil)
  [1,-1].forEach(sd=>{
    const e=[h[0]+v[0]*3+pp[0]*5.2*sd,h[1]+v[1]*3+pp[1]*5.2*sd];
    ctx.fillStyle="#ffd23f";ctx.beginPath();ctx.arc(e[0],e[1],3.1,0,7);ctx.fill();
    ctx.fillStyle="#111";ctx.beginPath();ctx.ellipse(e[0],e[1],.8,2.3,ang,0,7);ctx.fill();
  });
}

document.addEventListener("keydown",e=>{
  const m={ArrowUp:"U",w:"U",W:"U",ArrowDown:"D",s:"D",S:"D",ArrowLeft:"L",a:"L",A:"L",ArrowRight:"R",d:"R",D:"R"};
  if(m[e.key]){e.preventDefault();turn(m[e.key])}
  else if(e.key===" "){e.preventDefault();state==="idle"||state==="over"?begin():pause()}
});
document.querySelectorAll(".pad button").forEach(b=>b.addEventListener("click",()=>turn(b.dataset.d)));
$("go").addEventListener("click",begin);
$("pause").addEventListener("click",()=>{state==="idle"||state==="over"?begin():pause()});

let tx,ty;
cv.addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
cv.addEventListener("touchend",e=>{
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;
  turn(Math.abs(dx)>Math.abs(dy)?(dx>0?"R":"L"):(dy>0?"D":"U"));
},{passive:true});

reset();
</script>
</body>
</html>
